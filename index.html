<style>
/* Layout: field-desk console. Left rail = tier/mission ladder + status dossier; right = live workspace that changes shape per language (terminal, Python IDE, DB client). */
:root{
  --desk:#0a0e13; --panel:#111823; --panel2:#0c121a; --line:#223044; --line2:#1a2533;
  --text:#d6dde6; --muted:#7d8ba0; --dim:#4e5a6e;
  --amber:#ffb23e; --amber2:#a8752a; --green:#5ad6a0; --green2:#2a5f47;
  --cyan:#56b6e0; --red:#ff7a66; --violet:#b98cff; --gold:#ffd166;
  --paper:#ccd2d4; --paper-ink:#1b2128; --paper-rule:#b4bcc1; --redact:#0a0c0f; --stamp:#c8382d;
  --f-display:"Saira Stencil One",Impact,"Arial Narrow",sans-serif;
  --f-type:"Special Elite","Courier New",monospace;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:var(--f-mono);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--text);font-family:var(--f-mono);font-size:14px;line-height:1.5;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 36px;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(255,178,62,.05),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(86,182,224,.05),transparent 55%)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:var(--f-mono);cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::selection{background:var(--amber);color:#0a0e13}

/* ---- top bar ---- */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.5vw,40px);line-height:.9;margin:0;letter-spacing:.02em}
.brand h1 span{color:var(--amber)}
.brand .sub{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rank{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rank b{font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.05em;color:var(--gold)}
.xpbar{width:150px;height:7px;background:#070b10;border:1px solid var(--line);position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0;right:auto;background:linear-gradient(90deg,var(--amber2),var(--gold));transition:width .5s}
.xpnum{font-size:10px;color:var(--muted);letter-spacing:.08em}
.mini{display:flex;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);padding:5px 9px;font-size:11px;color:var(--muted);letter-spacing:.06em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.chip.badges{cursor:pointer}
.reset{background:transparent;border:1px solid var(--line2);color:var(--dim);font-size:10px;padding:5px 8px;letter-spacing:.1em}
.reset:hover{color:var(--red);border-color:var(--red)}

/* ---- track tabs ---- */
.tracks{display:flex;gap:8px;flex-wrap:wrap}
.track{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-bottom-width:3px;padding:9px 16px;display:flex;flex-direction:column;gap:2px;min-width:132px;text-align:left}
.track b{font-size:14px;color:var(--text);font-weight:600;letter-spacing:.04em}
.track small{font-size:10px;letter-spacing:.11em;text-transform:uppercase}
.track .tbadge{font-size:9px;color:var(--green);letter-spacing:.08em}
.track[aria-pressed=true]{border-color:var(--amber);color:var(--amber);background:#15100a}
.track[aria-pressed=true] b{color:var(--amber)}

/* ---- main grid ---- */
.board{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "work" "brief"}
@media (min-width:1000px){.board{grid-template-columns:300px minmax(0,1fr);grid-template-areas:"rail work" "rail brief";align-items:start}}

/* ---- left rail ---- */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);min-width:0}
.card>h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0;padding:10px 12px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center}
.ladder{padding:8px}
.tier{margin-bottom:6px}
.tier-h{display:flex;align-items:center;gap:8px;padding:6px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tier-h .tg{font-size:9px;padding:2px 6px;border:1px solid var(--line);color:var(--muted);letter-spacing:.1em}
.tier.locked{opacity:.5}
.tier.locked .tier-h::after{content:"🔒";margin-left:auto;font-size:11px}
.tier[data-tn="0"] .tg{color:var(--green);border-color:var(--green2)}
.tier[data-tn="1"] .tg{color:var(--cyan);border-color:#234}
.tier[data-tn="2"] .tg{color:var(--amber);border-color:var(--amber2)}
.tier[data-tn="3"] .tg{color:var(--violet);border-color:#44356b}
.mlist{list-style:none;margin:0;padding:0 0 4px 4px}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px;color:var(--muted);border-left:2px solid transparent;cursor:pointer;min-width:0}
.mrow:hover{color:var(--text);background:var(--line2)}
.mrow .dot{width:16px;height:16px;border:1px solid var(--line);border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:9px}
.mrow.done .dot{background:var(--green2);border-color:var(--green);color:var(--green)}
.mrow.cur{color:var(--amber);border-left-color:var(--amber);background:#15100a}
.mrow.cur .dot{border-color:var(--amber)}
.mrow.locked{opacity:.45;cursor:not-allowed}
.mrow .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .boss{color:var(--violet);font-size:9px;margin-left:auto;letter-spacing:.1em}

/* ---- dossier ---- */
.dossier{background:var(--paper);color:var(--paper-ink);font-family:var(--f-type);padding:16px 15px 18px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--paper-rule) 25px 26px);background-position:0 70px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.dossier .dh{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--paper-ink);padding-bottom:6px;background:var(--paper)}
.dstamp{position:absolute;right:10px;top:40px;font-family:var(--f-display);font-size:19px;letter-spacing:.06em;color:var(--stamp);border:3px solid var(--stamp);padding:1px 7px;transform:rotate(-8deg);opacity:.8;pointer-events:none}
.dstamp.dec{color:#1f7a45;border-color:#1f7a45;font-size:15px}
.dtitle{font-family:var(--f-display);font-weight:400;font-size:18px;margin:8px 0 2px;letter-spacing:.03em}
.dsub{font-size:11px;margin:0 0 8px;opacity:.75}
.dlines{list-style:none;margin:0;padding:0}
.dlines li{display:flex;gap:6px;align-items:baseline;min-height:26px;padding-top:4px;font-size:13px}
.dlines li .dn{font-size:10px;opacity:.55;flex-shrink:0}
.bar{display:inline-block;background:var(--redact);color:transparent;height:1.02em;vertical-align:-.12em;user-select:none;border-radius:1px}
.secret{background:rgba(200,56,45,.12);border-bottom:2px solid var(--stamp);padding:0 2px;font-weight:bold}

/* ---- center work area ---- */
.work{grid-area:work;display:flex;flex-direction:column;gap:12px;min-width:0}
.mission{background:var(--panel);border:1px solid var(--line);grid-area:brief;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.mhead .mlvl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.mhead h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:3px 0 0;letter-spacing:.02em;text-wrap:balance}
.mbody{padding:12px 14px;display:flex;flex-direction:column;gap:11px}
.brieftext{margin:0;color:var(--text);max-width:68ch}
.task{border-left:3px solid var(--amber);padding:7px 0 7px 12px;color:var(--gold)}
.task::before{content:"OBJECTIVE";display:block;font-size:9px;letter-spacing:.16em;color:var(--amber2);margin-bottom:2px}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.crit li{font-size:12px;color:var(--muted);padding-left:16px;position:relative}
.crit li::before{content:"▸";position:absolute;left:2px;color:var(--amber2)}
.ctxlabel{font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.ctx{margin:0;background:#070b10;border:1px solid var(--line2);padding:9px 11px;overflow-x:auto;font-size:12.5px;color:#b9c6d6;white-space:pre}

/* workspace panels share a frame */
.ws{background:#070b10;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.wsbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;background:var(--panel2)}
.wsbar .fn{color:var(--text);font-weight:600;letter-spacing:.04em;text-transform:none}
.wsbar .dots{display:flex;gap:5px}
.wsbar .dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.wsbar .dots i.r{background:#e05a4a}.wsbar .dots i.y{background:var(--amber)}.wsbar .dots i.g{background:var(--green)}
.actions{display:flex;gap:7px;flex-wrap:wrap;padding:9px 12px;background:var(--panel2);border-top:1px solid var(--line)}
.btn{font-size:12px;background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 13px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--text);border-color:var(--muted)}
.btn.run{color:var(--cyan);border-color:#2a4a5c}.btn.run:hover{background:#0d2430}
.btn.submit{color:#07090c;background:var(--amber);border-color:var(--amber);font-weight:700}
.btn.submit:hover{background:var(--gold)}
.btn.ghost{margin-left:auto}
.btn kbd{font-size:9px;opacity:.6;border:1px solid currentColor;border-radius:3px;padding:0 3px;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}

/* CodeMirror theming */
.CodeMirror{height:auto;background:#070b10;color:#d6dde6;font-family:var(--f-mono);font-size:13.5px;line-height:1.55}
.editor .CodeMirror{min-height:210px}
.CodeMirror-gutters{background:#0a1017;border-right:1px solid var(--line2)}
.CodeMirror-linenumber{color:#3a4557}
.CodeMirror-cursor{border-left:1px solid var(--amber)}
.cm-s-default .cm-keyword{color:var(--violet)}.cm-s-default .cm-def{color:var(--cyan)}
.cm-s-default .cm-string,.cm-s-default .cm-string-2{color:var(--green)}
.cm-s-default .cm-number{color:var(--gold)}.cm-s-default .cm-comment{color:#5a6678;font-style:italic}
.cm-s-default .cm-operator{color:var(--amber)}.cm-s-default .cm-builtin,.cm-s-default .cm-variable-2{color:var(--cyan)}
.CodeMirror-matchingbracket{color:var(--amber)!important;font-weight:700}

/* output console */
.console{font-size:13px;white-space:pre-wrap;word-break:break-word;padding:10px 12px;min-height:84px;max-height:240px;overflow:auto;background:#05080c}
.console .muted{color:var(--muted)}.console .err{color:var(--red)}.console .ok{color:var(--green)}
.console .label{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.console .reveal{color:#07090c;background:var(--amber);padding:1px 7px;font-weight:700;display:inline-block;margin:3px 0}
.console .cmd{color:#ffe0a8}

/* test checklist */
.tests{border-top:1px solid var(--line2);padding:9px 12px;background:var(--panel2);display:none;flex-direction:column;gap:4px}
.tests.show{display:flex}
.tests .th{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tc{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted)}
.tc .mk{width:15px;flex-shrink:0;text-align:center}
.tc.pass{color:var(--green)}.tc.pass .mk::before{content:"✔"}
.tc.fail{color:var(--red)}.tc.fail .mk::before{content:"✗"}
.tc.wait .mk::before{content:"○";color:var(--dim)}
.tc .hidden-tag{color:var(--violet);font-size:9px;letter-spacing:.08em;margin-left:4px}

/* terminal (linux) */
.log{min-height:260px;max-height:360px;overflow-y:auto;padding:11px 13px;font-size:13.5px;color:var(--amber);text-shadow:0 0 6px rgba(255,178,62,.22);white-space:pre-wrap;word-break:break-word}
.log .cmd{color:#ffe0a8}.log .out{color:var(--amber)}.log .sys{color:var(--muted);text-shadow:none}
.log .err{color:var(--red);text-shadow:none}.log .ok{color:var(--green);text-shadow:0 0 6px rgba(90,214,160,.3)}
.log .reveal{color:#07090c;background:var(--amber);text-shadow:none;display:inline-block;padding:1px 7px;font-weight:700;margin:2px 0}
.log .intel{color:#c9d3df;text-shadow:none;border-left:2px solid var(--line);padding-left:10px;margin:3px 0}
.log>div{margin-bottom:2px}
form.prompt{display:flex;align-items:center;gap:8px;padding:9px 13px;border-top:1px solid var(--line);background:var(--panel2)}
.ps{color:var(--green);white-space:nowrap;font-size:13px;flex-shrink:0;max-width:48%;overflow:hidden;text-overflow:ellipsis}
#cmd{flex:1;min-width:0;background:transparent;border:0;color:#ffe0a8;font-family:var(--f-mono);font-size:16px;caret-color:var(--amber);padding:3px 0}
#cmd:focus{outline:none}

/* DB client: schema explorer + results grid */
.dbwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:640px){.dbwrap{grid-template-columns:190px minmax(0,1fr)}}
.schema{border-right:1px solid var(--line2);background:#060a0e;padding:9px 10px;font-size:12px;overflow:auto;max-height:230px}
.schema .sh{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.tbl{margin-bottom:9px}
.tbl>.tn{color:var(--cyan);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.tbl>.tn::before{content:"▸";font-size:9px;transition:transform .15s;color:var(--muted)}
.tbl.open>.tn::before{transform:rotate(90deg)}
.tbl .cols{list-style:none;margin:3px 0 0;padding:0 0 0 14px;display:none}
.tbl.open .cols{display:block}
.tbl .cols li{color:var(--muted);font-size:11.5px;padding:1px 0;cursor:pointer}
.tbl .cols li:hover{color:var(--text)}
.tbl .cols li .ty{color:var(--dim);font-size:9.5px;margin-left:5px}
.tbl .cols li .pk{color:var(--gold);font-size:9px;margin-left:4px}
.tbl .cols li .fk{color:var(--violet);font-size:9px;margin-left:4px}
.dbmain{display:flex;flex-direction:column;min-width:0}
.grid-wrap{overflow:auto;max-height:260px;min-height:70px;background:#05080c}
table.grid{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border:1px solid var(--line2);padding:5px 9px;text-align:left;white-space:nowrap}
table.grid th{background:var(--panel);color:var(--cyan);position:sticky;top:0;font-weight:600;letter-spacing:.03em}
table.grid td{color:var(--text)}
table.grid td.null{color:var(--dim);font-style:italic}
table.grid tr:nth-child(even) td{background:#070c11}
.gridmsg{padding:11px 12px;font-size:12.5px;color:var(--muted)}
.gridmsg.err{color:var(--red)}.gridmsg.ok{color:var(--green)}
.rowcount{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:none}
.history{border-top:1px solid var(--line2);max-height:0;overflow:hidden;transition:max-height .2s;background:var(--panel2)}
.history.open{max-height:150px;overflow:auto}
.history .hi{padding:5px 12px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history .hi:hover{color:var(--text);background:var(--line2)}

/* hint / intel popover rows */
.aux{display:flex;flex-direction:column;gap:8px}
.auxbtns{display:flex;gap:7px;flex-wrap:wrap}
.panel-note{background:var(--panel);border:1px solid var(--line);padding:10px 12px;font-size:12.5px;color:var(--text);display:none}
.panel-note.show{display:block}
.panel-note h4{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
.panel-note pre{background:#070b10;border:1px solid var(--line2);padding:9px 11px;overflow-x:auto;font-size:12px;color:#c9d3df;margin:8px 0 0;white-space:pre}
.panel-note .jobnote{border-left:3px solid var(--green2);padding-left:10px;margin-top:9px;color:var(--muted)}
.panel-note .jobnote b{color:var(--green)}
.drill{margin-top:9px;border-top:1px dashed var(--line2);padding-top:8px}
.drill .q{color:var(--cyan)}
.drill .reveal-a{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:10px;padding:3px 8px;margin-top:5px;letter-spacing:.08em}
.drill .a{margin-top:6px;color:var(--text);display:none}
.drill .a.show{display:block}
.hintbox{background:var(--panel);border:1px solid var(--amber2);padding:9px 12px;font-size:12.5px;color:var(--gold);display:none}
.hintbox.show{display:block}
.hintbox .hl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber2);display:block;margin-bottom:3px}

/* toast / badge popups */
.toast-wrap{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,92vw)}
.toast{background:var(--panel);border:1px solid var(--amber);border-left-width:4px;padding:11px 15px;font-size:13px;color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.5);animation:pop .3s ease}
.toast.badge{border-color:var(--gold);text-align:center}
.toast.badge .bt{font-family:var(--f-display);color:var(--gold);font-size:17px;letter-spacing:.04em;display:block}
.toast.rankup{border-color:var(--violet)}
.toast .big{font-family:var(--f-display);font-size:15px;letter-spacing:.03em;color:var(--amber)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,8,12,.82);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);max-width:560px;width:100%;max-height:86vh;overflow:auto}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;padding:15px 18px;border-bottom:1px solid var(--line2);letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{background:transparent;border:0;color:var(--muted);font-size:20px}
.sheet .sbody{padding:15px 18px}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bcard{border:1px solid var(--line2);padding:11px;text-align:center;opacity:.4}
.bcard.earned{opacity:1;border-color:var(--gold)}
.bcard .bi{font-size:26px}
.bcard .bn{font-family:var(--f-display);font-size:13px;color:var(--gold);letter-spacing:.03em;margin-top:5px}
.bcard .bd{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.bcard.earned .bd{color:var(--text)}

.cheat{grid-column:1/-1;color:var(--dim);font-size:11px;display:flex;gap:6px 16px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:10px}
.cheat code{color:var(--amber2)}

@media (max-width:480px){.editor .CodeMirror{min-height:170px}.log{min-height:200px}.xpbar{width:110px}.dstamp{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
window.TRACKS = {};
/* ================= PYTHON TRACK ================= */
const C = String.raw;
TRACKS.python = {
  key:'python', label:'Python', op:'OPERATION SERPENT', file:'DF-PY', ui:'ide', ext:'py',
  tiers:[
  /* ---------- NOOB ---------- */
  { case:'THE FARM', intro:'Recruits who cannot talk to a machine never leave the Farm. Pass five drills to earn field status.',
    missions:[
    { id:'py-n1', title:'Wake the Console',
      brief:'Your terminal at the Farm is dark. Headquarters is waiting for a sign of life. Every Python program you ever write starts with one move: putting text on the screen.',
      task:'Print the exact words AGENT ONLINE.',
      starter:C`# DRILL 1 · First signal
# print() shows text on the screen. Text goes inside quotes.
# Example:  print("hello")
#
# TODO: print the words AGENT ONLINE

`,
      out:[['Prints AGENT ONLINE', /^AGENT ONLINE$/m]],
      hints:['Use print( ) with the words inside quotation marks.','Type exactly: print("AGENT ONLINE")'],
      solution:C`print("AGENT ONLINE")`,
      fb:[/print\(\s*(['"])AGENT ONLINE\1\s*\)/], fbOut:'AGENT ONLINE',
      line:'Recruit status: {X}', secret:'SIGNAL CONFIRMED',
      intel:{ note:'print() sends text to the screen, which programmers call standard output. Text in quotes is a string. Single and double quotes both work as long as they match. Each print() ends with a new line.',
        syntax:C`print("hello")
print('single quotes work too')
print("a", "b", 3)    # prints: a b 3` } },

    { id:'py-n2', title:'Cover Story',
      brief:'You need a cover identity the system can remember. Variables are labeled boxes: you put a value in once and use the label everywhere after that.',
      task:'Create a variable named clearance set to the number 3, then print: Agent NIGHTJAR, clearance 3',
      starter:C`# DRILL 2 · Build your cover
# A variable is a labeled box:   name = value
codename = "NIGHTJAR"

# TODO 1: make a variable called clearance and set it to the number 3


# TODO 2: print exactly:   Agent NIGHTJAR, clearance 3
# Tip: an f-string drops variables into text:  f"Hi {codename}"

`,
      tests:[['clearance is the number 3 (not text)','clearance == 3 and type(clearance) == int']],
      out:[['Prints Agent NIGHTJAR, clearance 3', /^Agent NIGHTJAR, clearance 3$/m]],
      hints:['Numbers do not get quotes. Then use an f-string with {codename} and {clearance} inside.','clearance = 3\nprint(f"Agent {codename}, clearance {clearance}")'],
      solution:C`codename = "NIGHTJAR"
clearance = 3
print(f"Agent {codename}, clearance {clearance}")`,
      fb:[/clearance\s*=\s*3\b/, /print\(/], fbOut:'Agent NIGHTJAR, clearance 3',
      line:'Cover identity: {X}', secret:'NIGHTJAR, import/export broker',
      intel:{ note:'A single = stores a value. Strings need quotes, numbers do not: "3" is text and 3 is a number. An f-string (a string with f in front) swaps anything in {curly braces} for its value.',
        syntax:C`name = "WREN"        # str
level = 4            # int
pay = 41.5           # float
active = True        # bool
print(f"{name} is level {level}")
print(type(level))   # <class 'int'>` } },

    { id:'py-n3', title:'Expense Report',
      brief:'The Farm audits every recruit. Your trip had three costs, and accounting wants to know what is left of the budget. Python does math the way a calculator does.',
      task:'Store the leftover budget in a variable called remaining, then print it.',
      starter:C`# DRILL 3 · Expense report
budget = 5000
hotel = 1890
flights = 1435
gear = 450

# TODO: remaining = the budget minus all three costs


# TODO: print remaining

`,
      tests:[['remaining equals 1225','remaining == 1225'],['Calculated, not typed in','"1225" not in __code']],
      out:[['Prints 1225', /^1225$/m]],
      hints:['Subtract each cost from budget with the - operator.','remaining = budget - hotel - flights - gear\nprint(remaining)'],
      solution:C`budget = 5000
hotel = 1890
flights = 1435
gear = 450
remaining = budget - hotel - flights - gear
print(remaining)`,
      fb:[/remaining\s*=\s*budget\s*-/, /print\(\s*remaining\s*\)/], fbOut:'1225',
      line:'Op funds remaining: {X}', secret:'$1,225',
      intel:{ note:'Python follows normal math order. Use + - * / for arithmetic, // for division without the remainder, % for the remainder, and ** for powers. Keeping numbers in variables means one edit updates every calculation that uses them.',
        syntax:C`7 / 2     # 3.5
7 // 2    # 3
7 % 2     # 1
2 ** 10   # 1024
total = 3 * (4 + 1)   # 15` } },

    { id:'py-n4', title:'Checkpoint',
      brief:'The guard at the checkpoint only opens the gate for clearance 4 or higher. Programs make decisions with if and else, and the indented lines under each one run only when that branch is chosen.',
      task:'If clearance is 4 or more, print ACCESS GRANTED. Otherwise print ACCESS DENIED.',
      starter:C`# DRILL 4 · Checkpoint
clearance = 4

# TODO: decide what to print.
# Python uses a colon and an indented block:
#
#   if condition:
#       do this
#   else:
#       do that

`,
      tests:[['Uses if and else','"if " in __code and "else" in __code'],['Compares clearance to 4','any(s in __code for s in [">= 4", ">=4", "> 3", ">3"])']],
      out:[['Prints ACCESS GRANTED for clearance 4', /^ACCESS GRANTED$/m]],
      hints:['The comparison for "4 or more" is clearance >= 4. Indent the print lines by four spaces.','if clearance >= 4:\n    print("ACCESS GRANTED")\nelse:\n    print("ACCESS DENIED")'],
      solution:C`clearance = 4
if clearance >= 4:
    print("ACCESS GRANTED")
else:
    print("ACCESS DENIED")`,
      fb:[/if\s+clearance\s*(>=\s*4|>\s*3)\s*:/, /else\s*:/], fbOut:'ACCESS GRANTED',
      line:'Checkpoint code: {X}', secret:'GATE 7-ALPHA',
      intel:{ note:'Comparisons give True or False: == equal, != not equal, < > <= >=. Use elif to check more cases in order. Indentation is part of Python syntax, so the standard is four spaces per level.',
        syntax:C`if level >= 5:
    print("director")
elif level >= 3:
    print("field")
else:
    print("desk")

if active and level > 2:   # and / or / not
    print("deploy")` } },

    { id:'py-n5', title:'Roll Call',
      brief:'Graduation night. The instructor wants every agent on the roster called out, one per line. A for loop repeats the same lines once for each item in a list.',
      task:'Use a for loop to print each name with "> " in front, like > WREN',
      starter:C`# DRILL 5 · Roll call
roster = ["WREN", "KESTREL", "SWIFT", "HERON"]

# TODO: loop over roster and print each name like:  > WREN

`,
      tests:[['Uses a for loop','"for " in __code and " in " in __code']],
      out:[['Prints all four names in order', /^> WREN\n> KESTREL\n> SWIFT\n> HERON$/m]],
      hints:['for name in roster:  then indent a print that adds "> " to name.','for name in roster:\n    print("> " + name)'],
      solution:C`roster = ["WREN", "KESTREL", "SWIFT", "HERON"]
for name in roster:
    print("> " + name)`,
      fb:[/for\s+\w+\s+in\s+roster\s*:/, /print\(/], fbOut:'> WREN\n> KESTREL\n> SWIFT\n> HERON',
      line:'Graduating class: {X}', secret:'4 agents, cleared for field',
      intel:{ note:'A list holds items in order inside [square brackets]. A for loop takes each item in turn. range(n) gives the numbers 0 to n-1 when you need a counter, and enumerate() gives you the position and the item together.',
        syntax:C`for name in ["A", "B"]:
    print(name)

for i in range(3):        # 0, 1, 2
    print(i)

for i, name in enumerate(roster, start=1):
    print(i, name)` } }
    ]},

  /* ---------- SKID ---------- */
  { case:'SIGNALS', intro:'Field status granted. The listening post caught chatter all night, and someone has to clean it, count it and crack it.',
    missions:[
    { id:'py-s1', title:'Scrub the Intercept',
      brief:'The intercept came in backwards and padded with junk # symbols. Strings have built-in methods you can chain together, each one handing its result to the next.',
      task:'Set clean so it equals "Meet At Pier Nine", using string methods on raw.',
      starter:C`raw = "  ##ENIN REIP## TA TEEM  "

# Goal: clean == "Meet At Pier Nine"
# Useful: .strip()  .replace(old, new)  [::-1]  .title()
clean = raw

print(clean)
`,
      tests:[['clean == "Meet At Pier Nine"','clean == "Meet At Pier Nine"'],['Built from raw','"raw." in __code or "raw[" in __code']],
      out:[['Prints the clean message', /^Meet At Pier Nine$/m]],
      hints:['Strip the spaces, remove every #, reverse with [::-1], then title-case it.','clean = raw.strip().replace("#", "")[::-1].title()'],
      solution:C`raw = "  ##ENIN REIP## TA TEEM  "
clean = raw.strip().replace("#", "")[::-1].title()
print(clean)`,
      fb:[/clean\s*=\s*raw\./, /\[::-1\]/, /\.title\(\)/], fbOut:'Meet At Pier Nine',
      line:'Rendezvous: {X}', secret:'PIER NINE',
      intel:{ note:'Strings never change in place. Every method returns a new string, which is why you assign the result. Slicing is [start:stop:step], and a step of -1 walks the string backwards.',
        syntax:C`s = "  Field Agent  "
s.strip()          # "Field Agent"
s.lower()          # "  field agent  "
s.replace("a","4") # swaps every match
"a,b,c".split(",") # ["a", "b", "c"]
"-".join(["a","b"])# "a-b"
"agent"[0:3]       # "age"`,
        job:'Most real data shows up messy: stray spaces from a form, odd capitalization, wrong separators. Cleaning strings before you compare them avoids a whole class of "why doesn’t this match?" bugs in log parsing and scripts.' } },

    { id:'py-s2', title:'Word Count',
      brief:'Analysts want to know which words show up most in the chatter. A dictionary maps keys to values, which makes it a natural tally sheet.',
      task:'Fill counts so it maps every word to how many times it appears.',
      starter:C`chatter = "vault at dawn the vault code changed meet at the vault".split()

counts = {}
for word in chatter:
    # TODO: add 1 to this word's count
    # counts.get(word, 0) returns 0 if the word is new
    pass

print(counts)
`,
      tests:[['counts["vault"] is 3','counts["vault"] == 3'],['Every word counted','counts == {"vault":3,"at":2,"dawn":1,"the":2,"code":1,"changed":1,"meet":1}']],
      hints:['Inside the loop, set counts[word] to its current count plus 1.','counts[word] = counts.get(word, 0) + 1'],
      solution:C`chatter = "vault at dawn the vault code changed meet at the vault".split()
counts = {}
for word in chatter:
    counts[word] = counts.get(word, 0) + 1
print(counts)`,

const ENG = { pyReady:false, sqlDb:null, sqlReady:false, pyBlocked:false };

/* ---- Python via Skulpt ---- */
function pyRun(code, limitMs){
  let out = '';
  return new Promise(resolve=>{
    try{
      Sk.configure({
        output:t=>{ out += t; },
        read:f=>{ if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[f]===undefined) throw "File not found: '"+f+"'"; return Sk.builtinFiles.files[f]; },
        __future__:Sk.python3, execLimit: limitMs||4000, killableWhile:true, killableFor:true
      });
      const p = Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>', false, code, true));
      p.then(()=>resolve({ok:true, out}), e=>resolve({ok:false, out, err:pyErr(e)}));
    }catch(e){ resolve({ok:false, out, err:pyErr(e)}); }
  });
}
function pyErr(e){
  if(e && e.toString) {
    let s = e.toString();
    if(e.traceback && e.traceback.length && e.traceback[0].lineno) s += '  (line '+e.traceback[0].lineno+')';
    return s;
  }
  return String(e);
}
/* Grade a python mission: run learner code, then run assertions that can see its namespace.
   We append a probe that prints a JSON verdict line, re-running the student's module with checks. */
async function pyGrade(code, mission){
  // Build a harness: student code, then checks. __code holds raw source for source-based tests.
  const tests = mission.tests || [];
  const pre = mission.testPre ? mission.testPre + '\n' : '';
  let harness = code + '\n' + pre + '\n__code = ' + JSON.stringify(stripComments(code)) + '\n';
  harness += '__results = []\n';
  tests.forEach((t,i)=>{
    const expr = t[1].replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    harness += '__ok=False\ntry:\n    __ok = bool(' + t[1] + ')\nexcept Exception as __e:\n    __ok=False\n__results.append(__ok)\n';
  });
  harness += "print('\\n__VERDICT__' + ''.join('1' if x else '0' for x in __results))";
  const res = await pyRun(harness, 5000);
  // parse verdict
  const m = res.out.match(/__VERDICT__([01]*)/);
  const studentOut = res.out.replace(/\n?__VERDICT__[01]*\s*$/,'');
  if(!res.ok && !m){ return {ok:false, out:studentOut, err:res.err, marks:tests.map(()=>false)}; }
  const bits = m ? m[1] : '';
  const marks = tests.map((_,i)=> bits[i]==='1');
  let outOk = true, hasOut = false;
  (mission.out||[]).forEach(o=>{ hasOut = true; if(!o[1].test(studentOut)) outOk = false; });
  const testsOk = tests.length ? marks.every(Boolean) : true;
  const ok = outOk && testsOk && (tests.length>0 || hasOut);
  return {ok, out:studentOut, err:res.ok?null:res.err, marks};
}
function stripComments(src){
  return src.split('\n').map(l=>{
    // naive: drop a # that is not inside quotes
    let inS=null, out='';
    for(let i=0;i<l.length;i++){const c=l[i];
      if(inS){ out+=c; if(c===inS && l[i-1]!=='\\') inS=null; }
      else if(c==='#'){ break; }
      else { if(c==='"'||c==="'") inS=c; out+=c; }
    }
    return out;
  }).join('\n');
}
/* fallback grader when Python engine is blocked: regex "fingerprints" on source */
function pyGradeFallback(code, mission){
  const src = stripComments(code);
  const fb = mission.fb || [];
  const marks = (mission.tests||[]).map(()=>null);
  const ok = fb.length>0 && fb.every(re=>re.test(src));
  return {ok, out: ok ? (mission.fbOut||'') : '', fallback:true, marks};
}

let SQLjs=null;
async function sqlInit(seed){
  if(!SQLjs){ SQLjs = await initSqlJs(); }
  ENG.sqlDb = new SQLjs.Database();
  ENG.sqlDb.run(seed);
  ENG.sqlReady = true;
}
function sqlResetDb(seed){ try{ENG.sqlDb && ENG.sqlDb.close();}catch(e){} ENG.sqlDb = new SQLjs.Database(); ENG.sqlDb.run(seed); }
function sqlExec(query){
  try{
    const stmts = ENG.sqlDb.exec(query);
    // last SELECT result (for display); also capture if write happened
    const last = stmts.length ? stmts[stmts.length-1] : null;
    return {ok:true, result:last, all:stmts};
  }catch(e){ return {ok:false, err:e.message||String(e)}; }
}
/* compare two result sets; ordered=true keeps order, else sort rows */
function sameResult(a, b, ordered){
  if(!a||!b) return false;
  if(a.columns.length !== b.columns.length) return false;
  const norm = r => (ordered ? r.slice() : r.slice().sort(cmpRow));
  const A = norm(a.values), B = norm(b.values);
  if(A.length !== B.length) return false;
  for(let i=0;i<A.length;i++){
    if(A[i].length!==B[i].length) return false;
    for(let j=0;j<A[i].length;j++){ if(String(A[i][j])!==String(B[i][j])) return false; }
  }
  return true;
}
function cmpRow(a,b){ const s=JSON.stringify(a), t=JSON.stringify(b); return s<t?-1:s>t?1:0; }

function checkBadges(ctx){
  const total = Object.keys(S.solved).length;
  if(total>=1) grant('first-blood');

  // polyglot: at least one solve in each track
  if(['python','sql','linux'].every(t=>flat(t).some(x=>isSolved(x.m.id)))) grant('polyglot');
  if(ctx){
    const {track,tn} = ctx;
    const tier=TRACKS[track].tiers[tn];
    const full = tier.missions.every(m=>isSolved(m.id));
    if(full){
      if(TIER_NAMES[tn]==='SKID') grant('skid');

      if(TIER_NAMES[tn]==='ZERO-DAY') grant('boss');

async function sqlDoSubmit(m){
  const q=cm.getValue().trim(); pushHist(q);

  const sol = stageInfo?stageInfo.solution:m.solution;
  const ordered = stageInfo?stageInfo.ordered:m.ordered;
  const verify = m.verify;
  // run learner query on a FRESH db so writes don't poison the check
  sqlResetDb(T.seed);
  const lr = sqlExec(q);
  if(!lr.ok){ gridMsg('SQL error: '+lr.err,'err'); markAllWait(); return; }
  let learnerRes, solRes;
  if(verify){ // write-mission: compare verify query after running learner write
    const v1=sqlExec(verify); learnerRes=v1.result;
    sqlResetDb(T.seed); sqlExec(sol); const v2=sqlExec(verify); solRes=v2.result;
  } else {
    learnerRes = lr.result;
    sqlResetDb(T.seed); const sr=sqlExec(sol); solRes=sr.result;
  }
  sqlResetDb(T.seed); // restore clean for further play
  const pass = sameResult(learnerRes, solRes, ordered);
  if(learnerRes) renderGrid(learnerRes);
  else gridMsg('Your statement returned no result set to compare.','err');
  markSingle(pass);
  if(pass){ onSolve(m, null, ()=>gridMsg('Query matches the target result set.','ok')); }

  $('#ps').textContent=m.prompt||'$';
  logLine('— '+m.title.toUpperCase()+' —','sys');
  logLine('Objective: '+m.task,'sys');
  $('#tform').onsubmit=e=>{ e.preventDefault(); const v=$('#cmd').value; $('#cmd').value=''; termRun(m, v); };
  $('#cmd').addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'&&termHist.length){e.preventDefault();termIdx=Math.min(termHist.length-1,termIdx+1);$('#cmd').value=termHist[termIdx]||'';}
    if(e.key==='ArrowDown'){e.preventDefault();termIdx=Math.max(-1,termIdx-1);$('#cmd').value=termIdx<0?'':termHist[termIdx];}
  });
  setTimeout(()=>$('#cmd') && $('#cmd').focus({preventScroll:true}),50);
}
let termBooted=false;
function logLine(t,cls){ if(t===''||t==null) return; const l=$('#log'); const d=document.createElement('div'); d.className=cls||'out'; d.textContent=t; l.appendChild(d); l.scrollTop=l.scrollHeight; }
function termRun(m, raw){
  const s=raw.trim(); logLine((m.prompt||'$')+' '+raw,'cmd');
  if(s){ termHist.unshift(s); termIdx=-1; }
  const low=s.toLowerCase();
  if(low==='clear'){ $('#log').innerHTML=''; return; }
  if(low==='help'){ logLine('hint — nudge · brief — repeat objective · clear — wipe screen','sys'); return; }
  if(low==='hint'){ doHint(m); const h=(m.hints||[]); return; }
  if(low==='brief'){ logLine(m.brief,'sys'); logLine('Objective: '+m.task,'sys'); return; }
  if(!s) return;
  const ok = runCheck(m.check, s);
  if(ok){
    const out = typeof m.out==='function'?m.out(s):m.out;
    if(out) logLine(out,'out');
    onSolve(m, null, ()=>{ logLine('ACCESS GRANTED','ok'); });
  } else {
    const first=s.split(/\s+/)[0];
    let msg;
    const known=['ls','cat','cd','grep','chmod','less','more','head','tail','pwd','bash','sh','find','wc','sort','uniq','echo','./decrypt.sh'];
    if(TRACKS.linux.unknown && !known.includes(first) && !first.startsWith('./')) msg=TRACKS.linux.unknown(s);
    else if(first==='pwd') msg='/home/agent';
    else msg=TRACKS.linux.wrong||'Not the right move.';
    logLine(msg, first==='pwd'?'out':'err');
    bumpFail(m, null, true);
  }
}
function runCheck(c, s){ if(typeof c==='function') return c(s); if(c instanceof RegExp) return c.test(s.trim().replace(/;+$/,'')); return false; }

/* ============ SOLVE FLOW ============ */
function onSolve(m, outEl, after){
  // boss staging
  if(m.stages){
    const si=bossStage[m.id]||0;
    const st=m.stages[si];
    if(st.line){ /* intermediate reveal handled via final */ }
    if(si < m.stages.length-1){
      const carried = (cm ? cm.getValue() : (savedCode(m.id)||m.starter));
      const stub = m.stages[si+1].append||'';
      try{ localStorage.setItem(KEY+':code:'+m.id, carried + stub); }catch(e){}
      bossStage[m.id]=si+1;
      S._bossProgress=S._bossProgress||{}; S._bossProgress[m.id]=si+1; save();
      if(after) after();
      addXP(25);
      toast('', '<span class="big">STAGE CLEARED</span><br>Stage '+(si+1)+' of '+m.stages.length+' complete. +25 XP');
      renderWorkspace(); renderAll();
      return;
    }
  }
  if(after) after();
  const already=isSolved(m.id);
  const x=flat(S.track)[curGi(S.track)];
  if(!already){
    S.solved[m.id]=true; S.streak=(S.streak||0)+1;
    addXP(XP_BY_TIER[x.tn] + (m.boss?40:0));
    // clean-tier tracking: if no hint used in this tier so far and tier completes
    save();
    const el = outEl||document.createElement('div');
    revealSolveUI(m);
    checkBadges({track:S.track, tn:x.tn});
  } else {
    revealSolveUI(m);
  }
  save(); renderAll(true, m.id);
}
function revealSolveUI(m){
  const line = m.line ? m.line.replace('{X}', m.secret) : null;
  const host = TRACKS[S.track].ui==='term' ? $('#log') : $('#out');
  if(TRACKS[S.track].ui==='term'){
    if(line){ const d=document.createElement('div'); d.className='reveal'; d.textContent='DECLASSIFIED ▸ '+line; $('#log').appendChild(d); }
    if(m.intel&&m.intel.note){ const i=document.createElement('div'); i.className='intel'; i.textContent='Field note: '+m.intel.note; $('#log').appendChild(i); $('#log').scrollTop=$('#log').scrollHeight; }
    advanceHint(m);
  } else if(host){
    if(line){ const d=document.createElement('div'); d.className='reveal'; d.textContent='DECLASSIFIED ▸ '+line; host.appendChild(d); }
    host.appendChild(line2('ACCESS GRANTED · case file line declassified','ok'));
    advanceHint(m);
  }
  showIntel(m, true);
}
function advanceHint(m){} // placeholder (auto-advance handled by nav)

/* next-mission suggestion after solve */
function renderAll(reveal, revealId){
  renderHUD(); renderLadder(); renderMission(); renderDossier(reveal?revealId:null); renderCheat();
  renderAux();
}

function bumpFail(m, outEl, isTerm){
  S._fails=S._fails||{}; S._fails[m.id]=(S._fails[m.id]||0)+1;
  if(S._fails[m.id]===2 && !(S.hintsUsed[m.id])){ if(isTerm) logLine('Stuck? Type hint, or use the HINT button below.','sys'); }
}

/* ============ HINTS + INTEL ============ */
function renderAux(){
  const x=flat(S.track)[curGi(S.track)], m=x.m;
  const b=$('#auxbtns');
  b.innerHTML='<button class="btn" id="hintbtn">💡 Hint</button>'
    +'<button class="btn" id="intelbtn">📖 Field manual</button>'
    + (isSolved(m.id)&&x.gi<flat(S.track).length-1 ? '<button class="btn submit" id="nextbtn" style="margin-left:auto">Next file ▸</button>' : '');
  $('#hintbtn').onclick=()=>doHint(m);
  $('#intelbtn').onclick=()=>{ const el=$('#intelbox'); el.classList.toggle('show'); if(el.classList.contains('show')) showIntel(m); };
  if($('#nextbtn')) $('#nextbtn').onclick=()=>{ gotoGi(Math.min(flat(S.track).length-1, curGi(S.track)+1)); };
  // restore hint display state
  $('#hintbox').classList.remove('show');
  $('#intelbox').classList.remove('show');
}
function doHint(m){
  S.hintsUsed[m.id]=(S.hintsUsed[m.id]||0)+1; save();
  const hints=m.hints||[]; const n=Math.min(S.hintsUsed[m.id]-1, hints.length-1);
  const hb=$('#hintbox'); hb.classList.add('show');
  hb.innerHTML='<span class="hl">Hint '+(n+1)+' of '+hints.length+'</span>'+esc(hints[n]);
  if(TRACKS[S.track].ui==='term'){ logLine('HINT: '+hints[n],'sys'); }
}
function showIntel(m, inline){
  const el=$('#intelbox'); const it=m.intel||{};
  let html='<h4>Field Manual — '+esc(m.title)+'</h4>';
  if(it.note) html+='<div>'+esc(it.note)+'</div>';
  if(it.syntax) html+='<pre>'+esc(it.syntax)+'</pre>';
  if(it.job) html+='<div class="jobnote"><b>On the job:</b> '+esc(it.job)+'</div>';
  if(it.drill){ html+='<div class="drill"><div class="q">↯ Interview drill: '+esc(it.drill.q)+'</div><button class="reveal-a" id="drillbtn">Reveal answer</button><div class="a" id="drillans">'+esc(it.drill.a)+'</div></div>'; }
  el.innerHTML=html;
  if(inline) el.classList.add('show');
  if($('#drillbtn')) $('#drillbtn').onclick=()=>$('#drillans').classList.toggle('show');
}
function showSolution(m){
  const stageInfo=m.stages?bossStageInfo(m):null;
  const sol=stageInfo?(stageInfo.full||stageInfo.solution):m.solution;
  if(cm){ cm.setValue(sol); }
  S.hintsUsed[m.id]=(S.hintsUsed[m.id]||0)+99; save();
  const out=$('#out'); if(out) out.innerHTML='<span class="muted">Solution loaded into the editor. Run it to see it work, then Submit.</span>';
}

/* ============ NAV ============ */
function gotoGi(gi){
  const f=flat(S.track); const x=f[gi]; if(!x) return;
  if(!tierUnlocked(S.track, x.tn)){ toast('','<span class="big">LOCKED</span><br>Clear the previous tier to unlock '+TIER_NAMES[x.tn]+'.'); return; }
  cur[S.track]=gi; termBooted = TRACKS[S.track].ui!=='term' ? termBooted : termBooted;
  renderWorkspace(); renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}
function switchTrack(t){ S.track=t; save(); if(t==='linux'){ /* fresh terminal */ } renderWorkspace(); renderAll(); }

function line(t,cls){ const d=document.createElement('div'); if(cls) d.className=cls; d.textContent=t; return d; }
function line2(t,cls){ return line(t,cls); }

/* ============ MODAL (badges) ============ */
function openBadges(){
  const s=$('#sheet');
  s.innerHTML='<h3>Commendations <button id="closem">×</button></h3><div class="sbody"><div class="badgegrid">'
    +BADGES.map(b=>'<div class="bcard'+(S.badges.includes(b.id)?' earned':'')+'"><div class="bi">'+b.icon+'</div><div class="bn">'+b.name+'</div><div class="bd">'+b.desc+'</div></div>').join('')
    +'</div></div>';
  $('#modal').classList.add('show');
  $('#closem').onclick=()=>$('#modal').classList.remove('show');
}

function renderCheat(){
  const T=TRACKS[S.track];
  const c=$('#cheat');
  if(T.ui==='term') c.innerHTML='<span>Terminal: <code>hint</code> <code>brief</code> <code>clear</code> <code>help</code></span><span>Progress saves in this browser.</span>';
  else if(T.ui==='db') c.innerHTML='<span>Click a table/column in the explorer to insert it. <code>Ctrl+Enter</code> runs your query.</span><span>Reset DB restores the snapshot. Progress saves locally.</span>';
  else c.innerHTML='<span><code>Ctrl+Enter</code> runs your code. Submit checks the acceptance tests.</span><span>Progress saves in this browser.</span>';
}

/* ============ BOOT ============ */
async function boot(){
  // restore boss progress
  if(S._bossProgress){ Object.assign(bossStage, S._bossProgress); }
  // tabs
  $$('.track').forEach(b=>b.onclick=()=>switchTrack(b.dataset.t));
  $('#ladder').addEventListener('click',e=>{ const r=e.target.closest('.mrow'); if(r&&!r.classList.contains('locked')) gotoGi(+r.dataset.gi); });
  $('#hud-badges').onclick=openBadges;
  $('#reset').onclick=()=>{ if(confirm('Reset all progress, XP and badges?')){ try{Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k));}catch(e){} location.reload(); } };
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').classList.remove('show'); });

  // init SQL db
  try{ await sqlInit(TRACKS.sql.seed); }catch(e){ console.warn('sql init failed', e); }
  // probe python availability (eval/Function blocked under strict CSP)
  try{
    const probe = await pyRun('print(1+1)', 2000);
    ENG.pyBlocked = !(probe.ok && /2/.test(probe.out));
  }catch(e){ ENG.pyBlocked = true; }

  renderWorkspace(); renderAll();
  if(ENG.pyBlocked && S.track==='python'){ /* handled in run UI */ }
}

boot();
</script>
