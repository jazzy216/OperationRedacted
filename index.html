<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Operation Redacted</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Saira+Stencil+One&family=Special+Elite&display=swap">
<style>
/* Layout: dark field desk. Light steel-grey dossier sheet (left) beside an amber phosphor field terminal (right); stacks terminal-first on phones. */
:root{
  --desk:#0b0f14;
  --panel:#121821;
  --line:#243041;
  --text:#d5dbe3;
  --muted:#8693a5;
  --amber:#ffb23e;
  --amber-dim:#a8752a;
  --paper:#cdd3d6;
  --paper-ink:#1b2128;
  --paper-rule:#b3bbc0;
  --redact:#0a0c0f;
  --stamp:#c8382d;
  --ok:#7fd49a;
  --err:#ff7a66;
  --f-display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--text);font-family:var(--f-mono);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,48px);line-height:.95;margin:0;letter-spacing:.02em;color:var(--text)}
.brand h1 span{color:var(--amber)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

.tracks{display:flex;gap:6px;flex-wrap:wrap}
.track{font-family:var(--f-mono);background:var(--panel);color:var(--muted);border:1px solid var(--line);border-bottom-width:3px;
  padding:8px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.track b{font-size:13px;color:var(--text);font-weight:600;letter-spacing:.04em}
.track small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.track[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.track[aria-pressed="true"] b{color:var(--amber)}
.track:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.board{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "term" "dossier"}
@media (min-width:920px){.board{grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr);grid-template-areas:"dossier mission" "dossier term";align-items:start}
  .dossier{position:sticky;top:max(16px,env(safe-area-inset-top,0px))}}

/* Mission card */
.mission{grid-area:mission;background:var(--panel);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mhead .lvl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.mhead h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;letter-spacing:.03em;text-wrap:balance}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:26px;height:26px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:11px;cursor:pointer;padding:0}
.pip.done{background:#1c2a20;border-color:#3d6b4b;color:var(--ok)}
.pip.cur{border-color:var(--amber);color:var(--amber)}
.pip:disabled{cursor:not-allowed;opacity:.45}
.brief{margin:0;color:var(--text);max-width:65ch}
.obj{border-left:3px solid var(--amber);padding:6px 0 6px 12px;color:var(--amber);font-weight:500}
.obj::before{content:"OBJECTIVE";display:block;font-size:10px;letter-spacing:.16em;color:var(--amber-dim);margin-bottom:2px}
.ctx{margin:0;background:#0a0e13;border:1px solid var(--line);padding:10px 12px;overflow-x:auto;font-size:13px;color:#b9c6d6;white-space:pre}
.ctx-label{font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:-6px}

/* Terminal */
.term{grid-area:term;background:#07090c;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;position:relative}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tbar .dots{display:flex;gap:6px}
.tbar .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.tbar .dots i.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.log{height:340px;overflow-y:auto;padding:12px 14px 6px;font-size:13.5px;color:var(--amber);text-shadow:0 0 6px rgba(255,178,62,.25);white-space:pre-wrap;word-break:break-word}
.log .cmd{color:#ffe0a8}
.log .out{color:var(--amber)}
.log .sys{color:var(--muted);text-shadow:none}
.log .err{color:var(--err);text-shadow:none}
.log .ok{color:var(--ok);text-shadow:0 0 6px rgba(127,212,154,.3)}
.log .lesson{color:#c9d3df;text-shadow:none;border-left:2px solid var(--line);padding-left:10px;margin:4px 0}
.log .reveal{color:#07090c;background:var(--amber);text-shadow:none;display:inline-block;padding:0 6px;margin:2px 0;font-weight:600}
.log > div{margin-bottom:2px}
form.prompt{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#0a0d11}
.ps{color:var(--ok);white-space:nowrap;font-size:13px;flex-shrink:0;max-width:45%;overflow:hidden;text-overflow:ellipsis}
#cmd{flex:1;min-width:0;background:transparent;border:0;color:#ffe0a8;font-family:var(--f-mono);font-size:16px;caret-color:var(--amber);padding:4px 0}
#cmd:focus{outline:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px;background:#0a0d11}
.tools button{font-family:var(--f-mono);font-size:12px;background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.tools button:hover{color:var(--text);border-color:var(--muted)}
.tools button.go{color:#07090c;background:var(--amber);border-color:var(--amber);font-weight:600}

/* Dossier sheet */
.dossier{grid-area:dossier;background:var(--paper);color:var(--paper-ink);padding:26px 24px 30px;font-family:var(--f-type);position:relative;overflow:hidden;min-width:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--paper-rule) 31px 32px);background-position:0 120px;
  box-shadow:0 14px 30px rgba(0,0,0,.45)}
.dossier .hdr{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--paper-ink);padding-bottom:8px;background:var(--paper)}
.dossier h3{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,32px);margin:14px 0 4px;letter-spacing:.04em;line-height:1}
.dossier .intro{margin:0 0 14px;font-size:14px;max-width:60ch;background:var(--paper)}
.dlines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dlines li{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:baseline;min-height:32px;padding-top:6px;font-size:15px}
.dlines li .n{font-size:12px;opacity:.6}
.dlines li.cur .n{opacity:1;color:var(--stamp)}
.bar{display:inline-block;background:var(--redact);color:transparent;height:1.05em;vertical-align:-.15em;user-select:none;border-radius:1px}
.secret{background:rgba(200,56,45,.12);border-bottom:2px solid var(--stamp);padding:0 2px;font-weight:bold}
.stamp{position:absolute;right:18px;top:64px;font-family:var(--f-display);font-size:30px;letter-spacing:.08em;color:var(--stamp);border:3px solid var(--stamp);padding:2px 10px;transform:rotate(-9deg);opacity:.82;pointer-events:none}
.stamp.dec{color:#1f7a45;border-color:#1f7a45;font-size:26px}
.clear{margin-top:16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--paper-ink);padding-top:8px;background:var(--paper)}
.meter{display:flex;gap:3px}
.meter i{width:14px;height:8px;border:1px solid var(--paper-ink);display:block}
.meter i.f{background:var(--paper-ink)}

.cheat{grid-column:1/-1;color:var(--muted);font-size:12px;display:flex;gap:6px 18px;flex-wrap:wrap}
.cheat code{color:var(--amber)}

@media (max-width:480px){.log{height:280px}.stamp{font-size:22px;top:58px;right:10px}.dossier{padding:20px 16px 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>OPERATION <span>REDACTED</span></h1>
      <p>Type the right command. Declassify the file.</p>
    </div>
    <div class="tracks" role="group" aria-label="Choose a language">
      <button class="track" data-t="python" type="button"><b>PYTHON</b><small>Op. Serpent</small></button>
      <button class="track" data-t="sql" type="button"><b>SQL</b><small>Op. Ledger</small></button>
      <button class="track" data-t="linux" type="button"><b>LINUX CLI</b><small>Op. Dead Drop</small></button>
    </div>
  </header>

  <main class="board">
    <section class="dossier" id="dossier" aria-label="Case file"></section>

    <section class="mission" id="mission" aria-live="polite"></section>

    <section class="term" aria-label="Field terminal">
      <div class="tbar"><span id="tname">field terminal</span><span class="dots"><i class="on"></i><i></i><i></i></span></div>
      <div class="log" id="log" role="log"></div>
      <form class="prompt" id="form" autocomplete="off">
        <label class="ps" id="ps" for="cmd">$</label>
        <input id="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Command">
      </form>
      <div class="tools">
        <button type="button" data-c="hint">hint</button>
        <button type="button" data-c="brief">brief</button>
        <button type="button" data-c="clear">clear</button>
        <button type="button" data-c="help">help</button>
        <button type="button" data-c="next" class="go" id="nextBtn" hidden>next file ▸</button>
      </div>
    </section>
  </main>

  <div class="cheat"><span>Terminal commands: <code>hint</code> <code>brief</code> <code>clear</code> <code>next</code> <code>help</code></span><span>Progress is saved in this browser.</span></div>
</div>

<script>
/* ---------- helpers ---------- */
function table(h, rows){
  const w = h.map((x,i)=>Math.max(String(x).length, ...rows.map(r=>String(r[i]).length)));
  const line = r => ' ' + r.map((c,i)=>String(c).padEnd(w[i])).join(' | ');
  const sep = '-' + w.map(x=>'-'.repeat(x)).join('-+-') + '-';
  return [line(h), sep, ...rows.map(line), `(${rows.length} row${rows.length===1?'':'s'})`].join('\n');
}
const sqlN = s => s.trim().replace(/;+\s*$/,'').replace(/"/g,"'").replace(/\s+/g,' ').toLowerCase().replace(/\s*([=,(])\s*/g,'$1').replace(/\s+\)/g,')');
const py = (re) => s => { const m = s.trim().match(/^print\((.*)\)$/); return re.test(m ? m[1].trim() : s.trim()); };
const pyOut = (repr, plain) => s => /^print\(/.test(s.trim()) ? plain : repr;

const AGENTS = [[1,'WREN','ACTIVE',3],[2,'FALCON','RETIRED',5],[3,'MAGPIE','ACTIVE',4],[4,'OSPREY','MIA',2],[5,'HERON','ACTIVE',5]];
const AH = ['id','codename','status','clearance'];

/* ---------- content ---------- */
const TRACKS = {
  linux: {
    op:'OPERATION DEAD DROP', file:'DF-LNX-07', term:'deaddrop — bash',
    intro:'A field agent left a sealed package on a compromised server. Navigate the filesystem, find the vault, and run the decryptor.',
    boot:['Connecting to deaddrop.node via ssh...','Session established. You are logged in as agent.','Every correct command declassifies one line of the case file.'],
    unknown: s => `bash: ${s.split(/\s+/)[0]}: command not found`,
    wrong: 'Command ran, but the file stays sealed. That is not the move.',
    levels:[
      {title:'Recon', prompt:'agent@deaddrop:~$',
       brief:'You have just landed in a field terminal. Before touching anything, see what is in your home directory.',
       obj:'List the files in the current directory.',
       check:s=>/^ls(\s+-[a-zA-Z]+)*(\s+(\.|~|\.\/))?$/.test(s),
       out:'briefing.txt  notes.md  tools/',
       hints:['The command is two letters, short for "list".','Type: ls'],
       line:'Assigned handler: {X}', secret:'KESTREL',
       lesson:'ls lists what is in a directory. ls -l adds sizes, owners and permissions.'},
      {title:'Read the Brief', prompt:'agent@deaddrop:~$',
       brief:'There is a briefing file waiting for you. Print its contents to the screen.',
       obj:'Display the contents of briefing.txt.',
       check:s=>/^(cat|less|more|head|tail)\s+(\.\/|~\/)?briefing\.txt$/.test(s),
       out:'TO:   FIELD AGENT\nFROM: KESTREL\nThe package is in /classified.\nTrust nothing you cannot verify.',
       hints:['The command that "concatenates" files to the screen is three letters.','Type: cat briefing.txt'],
       line:'Drop location: {X}', secret:'/classified',
       lesson:'cat prints a whole file. For long files, less lets you scroll and q quits.'},
      {title:'Move In', prompt:'agent@deaddrop:~$', next:'agent@deaddrop:/classified$',
       brief:'The brief named the drop location. Get yourself there.',
       obj:'Change into the /classified directory.',
       check:s=>/^cd\s+\/classified\/?$/.test(s),
       out:'',
       hints:['cd means "change directory". Use the full path from the brief, starting with /.','Type: cd /classified'],
       line:'Secure site: {X}', secret:'SUBLEVEL 3',
       lesson:'cd moves you around. cd .. goes up one level, cd ~ goes home, and pwd prints where you are.'},
      {title:'Hidden Files', prompt:'agent@deaddrop:/classified$',
       brief:'A plain ls here only shows two files, but the vault is supposed to be in this folder. On Linux, any file whose name starts with a dot is hidden.',
       ctx:'$ ls\ndecrypt.sh  intercept.log',
       obj:'List ALL files, including hidden ones.',
       check:s=>/^ls\s+(-[a-zA-Z]*[aA][a-zA-Z]*\s*)+$/.test(s),
       out:'.  ..  .vault  decrypt.sh  intercept.log',
       hints:['ls takes a flag for "all". Flags start with a dash.','Type: ls -a'],
       line:'Hidden container: {X}', secret:'.vault',
       lesson:'ls -a shows dotfiles. ls -la shows them with full details. Config files like .bashrc hide this way too.'},
      {title:'Intercept', prompt:'agent@deaddrop:/classified$',
       brief:'intercept.log holds 40,000 lines of radio chatter. Somewhere in it is one line containing the word CODEWORD. Reading it by hand would take all night.',
       obj:'Search intercept.log for lines containing CODEWORD.',
       check:s=>/^grep\b/.test(s) && /codeword/i.test(s) && /intercept\.log\b/.test(s),
       out:'[03:14:07] CH-9 >> CODEWORD: ORCHID-9',
       hints:['grep searches text for a pattern. Pattern first, then the file.','Type: grep CODEWORD intercept.log'],
       line:'Vault codeword: {X}', secret:'ORCHID-9',
       lesson:'grep finds matching lines. -i ignores case, -n adds line numbers, -r searches a whole folder.'},
      {title:'Permissions', prompt:'agent@deaddrop:/classified$',
       brief:'decrypt.sh refuses to run. Its permissions read -rw-r--r--: read and write, but no x for execute.',
       ctx:'$ ./decrypt.sh\nbash: ./decrypt.sh: Permission denied',
       obj:'Make decrypt.sh executable.',
       check:s=>/^chmod\s+([ugoa]*\+[rwx]*x[rwx]*|[0-7]?[1357][0-7]{2})\s+(\.\/)?decrypt\.sh$/.test(s),
       out:"mode of 'decrypt.sh' changed from 0644 (rw-r--r--) to 0755 (rwxr-xr-x)",
       hints:['chmod changes file permissions. You want to add (+) execute (x).','Type: chmod +x decrypt.sh'],
       line:'Decryptor status: {X}', secret:'ARMED',
       lesson:'chmod +x adds execute. In number form, 755 means owner rwx (7) and everyone else r-x (5).'},
      {title:'Run It', prompt:'agent@deaddrop:/classified$',
       brief:'The decryptor is armed and the codeword is loaded. Run the script that sits in this folder.',
       obj:'Execute decrypt.sh from the current directory.',
       check:s=>/^(\.\/decrypt\.sh|(ba)?sh\s+(\.\/)?decrypt\.sh)$/.test(s),
       out:'Decrypting .vault with ORCHID-9...\n[################] 100%\nPAYLOAD: Meeting moved to Pier 14, 0600 Friday.',
       hints:['To run a script in the current folder you prefix it with ./','Type: ./decrypt.sh'],
       line:'Final payload: {X}', secret:'PIER 14 · 0600 FRIDAY',
       lesson:'./ means "this folder". Linux will not run scripts from the current directory without it. That is a security feature.'}
    ]
  },
  python: {
    op:'OPERATION SERPENT', file:'DF-PY-03', term:'serpent — python 3.12',
    intro:'A double agent is hiding inside the network. Use the Python console to wake the system, build a cover, and expose the mole.',
    boot:['Python 3.12.4 (secure build) on serpent-node','Type Python one line at a time.','Every correct line declassifies one entry in the case file.'],
    unknown: s => /^[a-z_]\w*$/i.test(s) ? `NameError: name '${s}' is not defined` : 'SyntaxError: invalid syntax',
    wrong: 'ACCESS DENIED. That line runs, but it is not what the file needs.',
    levels:[
      {title:'Wake the Console', prompt:'>>>',
       brief:'The console is dark. Send a signal so headquarters knows you are in.',
       obj:'Print the exact text AGENT ONLINE.',
       check:s=>/^print\(\s*(['"])AGENT ONLINE\1\s*\)$/.test(s.trim()),
       out:'AGENT ONLINE',
       hints:['print() shows text on screen. Text goes inside quotes.','Type: print("AGENT ONLINE")'],
       line:'Console status: {X}', secret:'LIVE',
       lesson:'print() writes to the screen. Strings can use "double" or \'single\' quotes, as long as they match.'},
      {title:'Build a Cover', prompt:'>>>',
       brief:'You need an alias the system will remember for the rest of the session.',
       obj:'Create a variable named codename holding the string "NIGHTJAR".',
       check:s=>/^codename\s*=\s*(['"])NIGHTJAR\1$/.test(s.trim()),
       out:'',
       hints:['A single = stores a value under a name: name = value','Type: codename = "NIGHTJAR"'],
       line:'Cover identity: {X}', secret:'NIGHTJAR, import/export broker',
       lesson:'= assigns a value to a name. Assignments print nothing. Python names use lowercase_with_underscores by convention.'},
      {title:'Measure the Cipher', prompt:'>>>',
       brief:'The cipher key was recovered. Before it can be used, you need its exact length.',
       ctx:'cipher = "XQZ-7741-BRAVO"',
       obj:'Find how many characters are in cipher.',
       check:py(/^len\(\s*cipher\s*\)$/),
       out:'14',
       hints:['There is a built-in function that returns the length of a string.','Type: len(cipher)'],
       line:'Key length: {X}', secret:'14 characters',
       lesson:'len() returns the length of a string, list or dictionary. Dashes and spaces count as characters.'},
      {title:'Find the Mole', prompt:'>>>',
       brief:'Intel says the mole is the third agent on the roster.',
       ctx:'agents = ["WREN", "FALCON", "MAGPIE", "OSPREY"]',
       obj:'Get the third item from the agents list.',
       check:py(/^agents\[\s*(2|-2)\s*\]$/),
       out:pyOut("'MAGPIE'",'MAGPIE'),
       hints:['Lists count from 0, not 1. Use square brackets after the name.','Type: agents[2]'],
       line:'Mole identified: {X}', secret:'MAGPIE',
       lesson:'Lists are zero-indexed: [0] is first, [2] is third, [-1] is last.'},
      {title:'Crack the Vault', prompt:'>>>',
       brief:'MAGPIE kept the vault details in a dictionary. You only need one value.',
       ctx:'vault = {"floor": 7, "code": "4471", "guard": "asleep"}',
       obj:'Get the value stored under the key "code".',
       check:py(/^vault(\[\s*(['"])code\2\s*\]|\.get\(\s*(['"])code\3\s*\))$/),
       out:pyOut("'4471'",'4471'),
       hints:['Dictionary values are read with the key in square brackets, in quotes.','Type: vault["code"]'],
       line:'Vault combination: {X}', secret:'4471',
       lesson:'vault["code"] raises KeyError if the key is missing. vault.get("code") returns None instead.'},
      {title:'Flip the Message', prompt:'>>>',
       brief:'The last transmission was sent backwards to dodge the filters.',
       ctx:'message = "TNIOP POTSKCAB TA TEEM"',
       obj:'Reverse the message string.',
       check:py(/^(message\[\s*::\s*-1\s*\]|(['"])\2\.join\(\s*reversed\(\s*message\s*\)\s*\))$/),
       out:pyOut("'MEET AT BACKSTOP POINT'",'MEET AT BACKSTOP POINT'),
       hints:['Slices take [start:stop:step]. Leave start and stop empty and step backwards.','Type: message[::-1]'],
       line:'Rendezvous: {X}', secret:'MEET AT BACKSTOP POINT',
       lesson:'A step of -1 walks the string backwards, so [::-1] reverses it. Works on lists too.'}
    ]
  },
  sql: {
    op:'OPERATION LEDGER', file:'DF-SQL-11', term:'ledger — psql',
    intro:'The agency\'s mission ledger is open to you for one session. Query it to find out who blew the Cairo operation.',
    boot:['psql (16.3) connected to database "ledger"','Tables: agents, missions. End queries with ; (optional here).','Every correct query declassifies one line of the case file.'],
    unknown: s => `ERROR:  syntax error at or near "${s.split(/\s+/)[0]}"`,
    wrong: 'Query ran. Wrong result set. File remains sealed.',
    schema:'agents(id, codename, status, clearance)\nmissions(id, agent_id, target, outcome)',
    levels:[
      {title:'Open the Ledger', prompt:'ledger=>',
       brief:'Start by seeing everything the agents table holds.',
       obj:'Select every column and row from the agents table.',
       check:s=>sqlN(s)==='select * from agents',
       out:table(AH,AGENTS),
       hints:['SELECT picks columns, FROM names the table. * means every column.','Type: SELECT * FROM agents;'],
       line:'Agents on file: {X}', secret:'5',
       lesson:'SELECT * FROM table returns everything. Fine for exploring; name your columns in real queries.'},
      {title:'Names Only', prompt:'ledger=>',
       brief:'Too much noise. Pull just the codenames.',
       obj:'Select only the codename column from agents.',
       check:s=>sqlN(s)==='select codename from agents',
       out:table(['codename'],AGENTS.map(r=>[r[1]])),
       hints:['Replace * with the column name you want.','Type: SELECT codename FROM agents;'],
       line:'First listed: {X}', secret:'WREN',
       lesson:'List the columns you want after SELECT, separated by commas: SELECT codename, status FROM agents.'},
      {title:'Active Duty', prompt:'ledger=>',
       brief:'Retired and missing agents are not your concern yet. Filter to the ones still working.',
       obj:"Show agents whose status is 'ACTIVE'.",
       check:s=>/^select (\*|[\w.,]+) from agents where status='active'$/.test(sqlN(s)),
       out:table(AH,AGENTS.filter(r=>r[2]==='ACTIVE')),
       hints:['WHERE filters rows. Text values go in single quotes.',"Type: SELECT * FROM agents WHERE status = 'ACTIVE';"],
       line:'Active operatives: {X}', secret:'3',
       lesson:"WHERE keeps only rows that match. Text needs 'single quotes'; numbers do not."},
      {title:'Rank by Clearance', prompt:'ledger=>',
       brief:'You need to know who outranks whom before you go asking questions.',
       obj:'List agents sorted by clearance, highest first.',
       check:s=>/^select (\*|[\w.,]+) from agents order by clearance desc$/.test(sqlN(s)),
       out:table(AH,[...AGENTS].sort((a,b)=>b[3]-a[3]||a[0]-b[0])),
       hints:['ORDER BY sorts. Add DESC for highest-to-lowest.','Type: SELECT * FROM agents ORDER BY clearance DESC;'],
       line:'Highest clearance: {X}', secret:'FALCON & HERON (level 5)',
       lesson:'ORDER BY column sorts ascending by default. DESC flips it.'},
      {title:'Count the Wins', prompt:'ledger=>',
       brief:'Now the missions table. Headquarters wants a single number.',
       ctx:table(['id','agent_id','target','outcome'],[[101,3,'ZURICH','SUCCESS'],[102,5,'TALLINN','SUCCESS'],[103,4,'CAIRO','COMPROMISED'],[104,1,'OSAKA','PENDING']]),
       obj:"Count how many missions have outcome 'SUCCESS'.",
       check:s=>/^select count\((\*|id|1)\) from missions where outcome='success'$/.test(sqlN(s)),
       out:table(['count'],[[2]]),
       hints:['COUNT(*) returns how many rows matched. Combine it with WHERE.',"Type: SELECT COUNT(*) FROM missions WHERE outcome = 'SUCCESS';"],
       line:'Successful operations: {X}', secret:'2',
       lesson:'COUNT(*) is an aggregate: it collapses many rows into one number. SUM, AVG, MIN and MAX work the same way.'},
      {title:'Follow the Thread', prompt:'ledger=>',
       brief:'The CAIRO mission was compromised. The missions table only stores agent_id, so you need to connect it to the agents table to get a name.',
       obj:"Join agents to missions and find the codename on the 'CAIRO' mission.",
       check:s=>{const n=sqlN(s);return /^select .+ from (agents|missions)( as)?( \w+)? (inner )?join (agents|missions)( as)?( \w+)? on .+=.+ where .*target='cairo'$/.test(n) && n.includes('agent_id');},
       out:table(['codename','status','target'],[['OSPREY','MIA','CAIRO']]),
       hints:['JOIN missions ON agents.id = missions.agent_id links the tables. Then filter with WHERE.',"Type: SELECT agents.codename FROM agents JOIN missions ON agents.id = missions.agent_id WHERE missions.target = 'CAIRO';"],
       line:'Compromised agent: {X}', secret:'OSPREY, now listed MIA',
       lesson:'JOIN combines rows from two tables where the ON condition matches. A foreign key like agent_id is what makes that possible.'}
    ]
  }
};

/* ---------- state ---------- */
const KEY='op-redacted-v1';
let state={track:'linux',solved:{linux:0,python:0,sql:0}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.solved)state=Object.assign(state,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

let cur=0, hintN=0, fails=0, justSolved=false, history=[], hIdx=0;
const $=id=>document.getElementById(id);
const logEl=$('log'), input=$('cmd');

function tr(){return TRACKS[state.track]}
function lv(){return tr().levels[cur]}
function complete(){return state.solved[state.track]>=tr().levels.length}
function promptStr(){
  const L=tr().levels;
  if(cur>=L.length){const last=L[L.length-1];return last.next||last.prompt;}
  if(cur>0 && L[cur-1].next && !L[cur].next) return L[cur].prompt;
  return L[cur].prompt;
}

function print(text,cls='out'){
  if(text===''||text==null)return;
  const d=document.createElement('div');d.className=cls;d.textContent=text;logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}

/* ---------- render ---------- */
function renderTabs(){
  document.querySelectorAll('.track').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===state.track));
  $('tname').textContent=tr().term;
}

function renderMission(){
  const t=tr(),L=t.levels,solved=state.solved[state.track];
  const pips=L.map((l,i)=>`<button class="pip ${i<solved?'done':''} ${i===cur?'cur':''}" data-i="${i}" ${i>solved?'disabled':''} aria-label="File ${i+1}${i<solved?' (solved)':''}">${i+1}</button>`).join('');
  const m=$('mission');
  if(cur>=L.length){
    m.innerHTML=`<div class="mhead"><span class="lvl">${t.op} · complete</span><div class="pips">${pips}</div></div>
      <h2>Case file declassified</h2>
      <p class="brief">Every redaction in ${t.file} is lifted. Replay any file above, or switch to another language track.</p>`;
    return;
  }
  const l=L[cur];
  m.innerHTML=`<div class="mhead"><span class="lvl">${t.op} · File ${cur+1} of ${L.length}</span><div class="pips">${pips}</div></div>
    <h2></h2><p class="brief"></p>
    ${t.schema?'<div class="ctx-label">Schema</div><pre class="ctx" id="sch"></pre>':''}
    ${l.ctx?'<div class="ctx-label">Known data</div><pre class="ctx" id="cx"></pre>':''}
    <div class="obj"></div>`;
  m.querySelector('h2').textContent=l.title;
  m.querySelector('.brief').textContent=l.brief;
  m.querySelector('.obj').textContent=l.obj;
  if(t.schema)m.querySelector('#sch').textContent=t.schema;
  if(l.ctx)m.querySelector('#cx').textContent=l.ctx;
}

function renderDossier(revealIdx=-1){
  const t=tr(),L=t.levels,solved=state.solved[state.track],done=solved>=L.length;
  const d=$('dossier');
  d.innerHTML=`<div class="hdr"><span>File ${t.file}</span><span>Eyes only</span></div>
    <div class="stamp ${done?'dec':''}">${done?'DECLASSIFIED':'TOP SECRET'}</div>
    <h3>${t.op}</h3><p class="intro"></p><ol class="dlines"></ol>
    <div class="clear"><span>Clearance ${solved}/${L.length}</span><span class="meter">${L.map((_,i)=>`<i class="${i<solved?'f':''}"></i>`).join('')}</span></div>`;
  d.querySelector('.intro').textContent=t.intro;
  const ol=d.querySelector('.dlines');
  L.forEach((l,i)=>{
    const li=document.createElement('li');if(i===cur&&!done)li.className='cur';
    const n=document.createElement('span');n.className='n';n.textContent='§'+(i+1);
    const body=document.createElement('span');
    const [pre,post]=l.line.split('{X}');
    body.append(pre);
    if(i<solved){
      const s=document.createElement('span');s.className='secret';s.textContent=l.secret;
      if(i===revealIdx)scramble(s,l.secret);
      body.append(s);
    }else{
      const b=document.createElement('span');b.className='bar';b.style.width=Math.max(4,l.secret.length*0.62)+'em';b.setAttribute('aria-label','redacted');b.textContent='x';
      body.append(b);
    }
    body.append(post||'');
    li.append(n,body);ol.append(li);
  });
}

function scramble(el,final){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=final;return;}
  const chars='█▓▒░#%&@$*';let f=0;const total=18;
  const tick=()=>{f++;
    el.textContent=final.split('').map((c,i)=>c===' '?' ':(i<final.length*f/total?c:chars[Math.random()*chars.length|0])).join('');
    if(f<total)setTimeout(tick,40);else el.textContent=final;};
  tick();
}

function renderAll(revealIdx){renderTabs();renderMission();renderDossier(revealIdx);$('ps').textContent=promptStr();$('nextBtn').hidden=!justSolved;}

/* ---------- flow ---------- */
function startTrack(t,boot=true){
  state.track=t;save();
  const solved=state.solved[t];cur=Math.min(solved,TRACKS[t].levels.length);
  hintN=0;fails=0;justSolved=false;logEl.innerHTML='';
  if(boot)TRACKS[t].boot.forEach(x=>print(x,'sys'));
  renderAll();announce();
}
function announce(){
  if(cur>=tr().levels.length){print('All files declassified on this track. Pick another language above.','ok');return;}
  print(`— FILE ${cur+1}: ${lv().title.toUpperCase()} —`,'sys');
  print('Objective: '+lv().obj,'sys');
}
function goTo(i){cur=i;hintN=0;fails=0;justSolved=false;renderAll();announce();}

function run(raw){
  const s=raw.trim();
  print(promptStr()+' '+raw,'cmd');
  if(s){history.push(s);hIdx=history.length;}
  const low=s.toLowerCase();
  if(!s){if(justSolved)next();return;}
  if(low==='clear'){logEl.innerHTML='';return;}
  if(low==='help'){print('hint   get a nudge (ask twice for the exact answer)\nbrief  repeat the objective\nnext   open the next file after solving\nclear  wipe the screen\nPick Python, SQL or Linux with the tabs at the top.','sys');return;}
  if(low==='next'){if(justSolved||cur<state.solved[state.track])next();else print('This file is still sealed. Solve it first, or type hint.','err');return;}
  if(cur>=tr().levels.length){print('Track complete. Choose another language above or tap a numbered file to replay.','sys');return;}
  if(low==='brief'){print(lv().brief,'sys');print('Objective: '+lv().obj,'sys');return;}
  if(low==='hint'){const h=lv().hints;print('HINT: '+h[Math.min(hintN,h.length-1)],'sys');hintN++;return;}
  if(justSolved){print('File already open. Type next (or press Enter) to move on.','sys');return;}

  const l=lv();
  if(l.check(s)){
    const out=typeof l.out==='function'?l.out(s):l.out;
    print(out,'out');
    const first=cur>=state.solved[state.track];
    if(first){state.solved[state.track]=cur+1;save();}
    print('ACCESS GRANTED','ok');
    print('DECLASSIFIED ▸ '+l.line.replace('{X}',l.secret),'reveal');
    print('Field note: '+l.lesson,'lesson');
    justSolved=true;
    if(cur===tr().levels.length-1){print('Last file. Press Enter to close the case.','sys');}
    else print('Press Enter or type next to open file '+(cur+2)+'.','sys');
    renderAll(cur);
  }else{
    fails++;
    const first=s.split(/\s+/)[0].toLowerCase();
    const t=state.track;
    let msg=tr().wrong;
    if(t==='linux'&&!['ls','cat','cd','grep','chmod','less','more','head','tail','pwd','bash','sh','./decrypt.sh'].includes(first))msg=tr().unknown(s);
    if(t==='sql'&&!/^select\b/i.test(s))msg=tr().unknown(s);
    if(t==='python'&&/^[a-z_]\w*$/i.test(s)&&!['codename','cipher','agents','vault','message'].includes(s))msg=tr().unknown(s);
    if(t==='linux'&&first==='pwd')msg=promptStr().split(':')[1].replace('$','').replace('~','/home/agent');
    print(msg, first==='pwd'?'out':'err');
    if(fails===2&&hintN===0)print('Stuck? Type hint.','sys');
  }
}
function next(){
  justSolved=false;
  if(cur<tr().levels.length-1){goTo(cur+1);}
  else{cur=tr().levels.length;renderAll();print('━━ CASE CLOSED ━━  '+tr().file+' fully declassified.','ok');
    const others=Object.keys(TRACKS).filter(k=>state.solved[k]<TRACKS[k].levels.length);
    print(others.length?'Next assignment: try the '+others.map(k=>k==='sql'?'SQL':k==='python'?'Python':'Linux').join(' or ')+' track.':'Every dossier is declassified. You are cleared for all three tracks.','sys');}
}

/* ---------- events ---------- */
$('form').addEventListener('submit',e=>{e.preventDefault();const v=input.value;input.value='';run(v);});
input.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&history.length){e.preventDefault();hIdx=Math.max(0,hIdx-1);input.value=history[hIdx]||'';}
  if(e.key==='ArrowDown'&&history.length){e.preventDefault();hIdx=Math.min(history.length,hIdx+1);input.value=history[hIdx]||'';}
});
document.querySelectorAll('.tools button').forEach(b=>b.addEventListener('click',()=>{run(b.dataset.c);input.focus({preventScroll:true});}));
document.querySelectorAll('.track').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.t!==state.track)startTrack(b.dataset.t);}));
$('mission').addEventListener('click',e=>{const p=e.target.closest('.pip');if(p&&!p.disabled)goTo(+p.dataset.i);});
logEl.addEventListener('click',()=>{if(!getSelection().toString())input.focus({preventScroll:true});});

startTrack(state.track);
</script>

</body></html>
